defaults:
  - sft_base
  - /models/ar1_5_zero@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: nav
  - override /vla_processor@data.val_dataset.vla_preprocess_args: nav
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    _recursive_: false
    local_dir: ???
    annotations_path: ???
    chunk_ids: [0, 1]
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    _recursive_: false
    local_dir: ???
    annotations_path: ???
    chunk_ids: [0, 1]
    vla_preprocess_args:
      generation_mode: true

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500
  num_train_epochs: 700
  #deepspeed: configs/deepspeed/zero3.json
paths:
  output_dir: output_stage0_nav
evaluate:
  eval_ckpt: null
task_name: alpamayo_r1_5_sft_stage0_nav

model:
  traj_vocab_size: 1000
  tokens_per_history_traj: 48
  tokens_per_future_traj: 192
  add_special_tokens: true
  traj_tokenizer_cfg:
    _target_: alpamayo_r1.models.delta_tokenizer.DeltaTrajectoryTokenizer
    num_bins: 1000
  hist_traj_tokenizer_cfg:
    _target_: alpamayo_r1.models.delta_tokenizer.DeltaTrajectoryTokenizer
    num_bins: 1000
